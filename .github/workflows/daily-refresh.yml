name: Daily refresh

# Rebuilds the public site from official exchange data after every trading session.
#
# This is what makes the tool self-maintaining: there is no server to keep alive, so the
# only moving part is this scheduled job. It fetches, scores, exports static files and
# deploys them. If it fails, the previously deployed site keeps serving — visitors see
# slightly older data rather than an outage.

on:
  schedule:
    # 19:15 IST = 13:45 UTC. NSE publishes the day's bhavcopy from ~18:30 IST, so this
    # leaves margin without leaving the board stale all evening. Weekdays only.
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Rebuild from cache only (no network fetch)"
        type: boolean
        default: false

concurrency:
  # A slow fetch must never overlap the next run and double up on NSE.
  group: market-lab-refresh
  cancel-in-progress: false

permissions:
  # write, because the bhavcopy archive is committed back after each run. NSE does not
  # serve old sessions indefinitely, so a day that is not captured is gone for good.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Version pinned in .nvmrc so CI and a developer's machine run the same npm. They
      # did not: the lockfile was written by npm 11 and the runner had npm 10, which
      # resolves @tailwindcss/oxide-wasm32-wasi's bundled dependencies differently and
      # made `npm ci` reject a lockfile that installs cleanly locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Everything here is regenerable from a source that is still live, so the cache is
      # a speed optimisation and nothing more. The bhavcopy archive is deliberately NOT
      # in this list: it is committed to the repository instead, because actions/cache is
      # evicted after 7 days of no access and NSE will not sell you back a session you
      # failed to capture. Relying on the cache for it meant the archive quietly stopped
      # accumulating, which is the one thing in this project that cannot be rebuilt.
      - name: Restore regenerable caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/delivery
            data/shareholding
            data/*.pkl
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Refresh market data and build static bundle
        env:
          SKIP_FETCH: ${{ inputs.skip_fetch }}
        run: |
          python - <<'PY'
          import os
          from marketlab import pipeline
          skip = os.environ.get("SKIP_FETCH", "").lower() == "true"
          meta = pipeline.run(skip_fetch=skip)
          print("scored", meta["scored"], "session", meta["last_trading_session"])
          PY

      # Deploying a broken bundle is worse than deploying nothing: the old site would be
      # replaced by one that fails in the browser. Verify before publishing.
      - name: Verify the bundle before deploying
        run: python scripts/verify_static.py

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      # Cloudflare Pages rather than GitHub Pages. A first visit is roughly 660KB
      # gzipped, so GitHub's 100GB/month soft cap works out at about 5,000 visitors a
      # day before it throttles — and it throttles by taking the site down, not by
      # billing. Cloudflare serves static assets with no bandwidth or request limit on
      # the free plan, which is the only way this stays free at the traffic it is built
      # for.
      # A Direct Upload project, deliberately not connected to this repo in Cloudflare.
      # A git-connected project would build the site itself, and the site cannot be built
      # from the repository alone: the board's data is generated by the Python pipeline
      # above and web/public/data is gitignored, so a Cloudflare-side build produces a
      # shell with no data in it. The bundle is built and verified here, then uploaded.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=market-lab --branch=main

      # Last, so a failed build or deploy never commits an archive for a run that did not
      # publish. Only the raw exchange files are committed; everything derived from them
      # is rebuilt on demand and would just be churn.
      - name: Commit new sessions to the archive
        if: success()
        run: |
          git config user.name  "market-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bhavcopy data/shareholders.parquet
          if git diff --cached --quiet; then
            echo "No new sessions or filings to archive."
            exit 0
          fi
          git commit -m "Archive market data through $(date -u +%Y-%m-%d)"
          # Two scheduled jobs write to this branch, so a run can find it has moved on.
          # Rebase and retry rather than failing a run that has already deployed.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "Could not push the archive after 3 attempts." >&2
          exit 1
