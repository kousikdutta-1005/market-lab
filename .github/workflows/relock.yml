name: Regenerate lockfile

# Temporary, run by hand. The lockfile npm writes on macOS is not accepted by npm ci on
# Linux for @tailwindcss/oxide-wasm32-wasi's bundled dependencies, so the file has to be
# produced on the platform that consumes it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Regenerate and prove it installs
        working-directory: web
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
          rm -rf node_modules
          npm ci
          npm run build

      - name: Commit the lockfile
        run: |
          git config user.name  "market-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already correct for Linux."
            exit 0
          fi
          git commit -m "Regenerate the lockfile on Linux so npm ci accepts it"
          git push
