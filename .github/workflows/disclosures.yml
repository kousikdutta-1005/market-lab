name: Intraday disclosures

# SEBI SAST filings and bulk/block deals are published through the trading day, not once
# at the close like the bhavcopy. Waiting for the evening run would leave the Investors
# page up to a day stale on its most time-sensitive data.
#
# This job deliberately does NOT refetch prices: it reuses the cached bhavcopy and only
# pulls disclosures, so it finishes in well under a minute and stays comfortably inside
# the free tier even running several times a day.

on:
  schedule:
    # 10:00, 12:30 and 15:30 IST on weekdays (04:30, 07:00 and 10:00 UTC).
    - cron: "30 4,7,10 * * 1-5"
  workflow_dispatch:

concurrency:
  # Must never overlap the evening full refresh, which rewrites the same files.
  group: market-lab-refresh
  cancel-in-progress: false

permissions:
  # write, to commit any bhavcopy sessions this run happens to pick up. See daily-refresh.
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Version pinned in .nvmrc so CI and a developer's machine run the same npm. They
      # did not: the lockfile was written by npm 11 and the runner had npm 10, which
      # resolves @tailwindcss/oxide-wasm32-wasi's bundled dependencies differently and
      # made `npm ci` reject a lockfile that installs cleanly locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: pip install -r requirements.txt

      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/delivery
            data/shareholding
            data/*.pkl
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      # skip_fetch reuses cached prices; disclosures are still fetched live inside the
      # pipeline, which is the whole point of this run.
      - name: Refresh disclosures
        run: |
          python - <<'PY'
          from marketlab import ownership, pipeline, universe as un
          u = un.build("all").set_index("symbol")
          _, meta = ownership.fetch_and_summarize(u.index)
          print("disclosures:", meta)
          out = pipeline.run(skip_fetch=True)
          print("rebuilt", out["scored"], "stocks with", len(out.get("investors", [])), "filers")
          PY

      - name: Verify the bundle before deploying
        run: python scripts/verify_static.py

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      # A Direct Upload project, deliberately not connected to this repo in Cloudflare.
      # A git-connected project would build the site itself, and the site cannot be built
      # from the repository alone: the board's data is generated by the Python pipeline
      # above and web/public/data is gitignored, so a Cloudflare-side build produces a
      # shell with no data in it. The bundle is built and verified here, then uploaded.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=market-lab --branch=main

      - name: Commit new sessions to the archive
        run: |
          git config user.name  "market-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bhavcopy
          if git diff --cached --quiet; then
            echo "No new trading sessions to archive."
            exit 0
          fi
          git commit -m "Archive market data through $(date -u +%Y-%m-%d)"
          # Two scheduled jobs write to this branch, so a run can find it has moved on.
          # Rebase and retry rather than failing a run that has already deployed.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "Could not push the archive after 3 attempts." >&2
          exit 1
