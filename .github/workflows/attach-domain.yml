name: Attach the custom domain

# One-off, run by hand. Attaching a custom domain to a Pages project is a single API
# call, but it needs the account token, which lives here as a secret and nowhere else.
# Running it from Actions is how that call gets made without the token leaving GitHub.
#
# Safe to re-run: it checks whether the domain is already attached first.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to attach"
        default: experiments.kousikdutta.com
      project:
        description: "Pages project name"
        default: market-lab

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach and report
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ inputs.domain }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"

          echo "== projects on this account =="
          curl -sS "$api" -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'):
              print('error:', d.get('errors')); sys.exit(1)
          for p in d['result']:
              print(' ', p['name'], '| git-connected' if p.get('source') else '| direct upload',
                    '|', (p.get('domains') or []))
          "

          echo "== attaching ${DOMAIN} to ${PROJECT} =="
          out="$(curl -sS -X POST "${api}/${PROJECT}/domains" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}")"

          echo "$out" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print('attached:', d['result'].get('name'), '| status:', d['result'].get('status'))
          else:
              msgs=[e.get('message','') for e in d.get('errors',[])]
              if any(k in m.lower() for m in msgs for k in ('already exists', 'already added', 'duplicate')):
                  print('already attached:', '; '.join(msgs))
              else:
                  print('failed:', '; '.join(msgs)); sys.exit(1)
          "

          echo "== domains now on ${PROJECT} =="
          curl -sS "${api}/${PROJECT}/domains" -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for x in d.get('result', []):
              print(' ', x.get('name'), '->', x.get('status'))
          "

          # A domain sits at 'pending' until DNS points at the project. Cloudflare usually
          # adds that record itself when the zone is on the same account; it did not here,
          # so create it. This needs Zone:DNS:Edit, which a Pages-only token does not have
          # — in that case say exactly what is missing rather than failing blankly.
          echo "== DNS =="
          zone="$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN#*.}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'):
              print('NOPERM:' + '; '.join(e.get('message','') for e in d.get('errors', [])))
          else:
              r=d.get('result') or []
              print(r[0]['id'] if r else 'NOZONE')
          ")"

          case "$zone" in
            NOPERM:*)
              echo "The token cannot read zones: ${zone#NOPERM:}"
              echo "Add a CNAME by hand, or re-mint the token with Zone -> DNS -> Edit:"
              echo "  ${DOMAIN}  CNAME  ${PROJECT}-4dk.pages.dev  (proxied)"
              exit 0 ;;
            NOZONE)
              echo "No zone found for ${DOMAIN#*.} on this account." ; exit 0 ;;
          esac

          target="$(curl -sS "${api}/${PROJECT}" -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")"
          echo "zone found; pointing ${DOMAIN} at ${target}"

          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${zone}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"CNAME\",\"name\":\"${DOMAIN}\",\"content\":\"${target}\",\"proxied\":true}" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print('created:', d['result']['name'], '->', d['result']['content'])
          else:
              msgs='; '.join(e.get('message','') for e in d.get('errors', []))
              print('already there' if 'already exists' in msgs.lower() else 'failed: ' + msgs)
          "
