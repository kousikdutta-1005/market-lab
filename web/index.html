    <script>
      // Applied before first paint: without this a dark-mode visitor gets a full-screen
      // white flash on every load, which is exactly when it is most unpleasant.
      (function () {
        try {
          var c = localStorage.getItem('ml-theme') || 'system';
          var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
